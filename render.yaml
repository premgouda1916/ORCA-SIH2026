services:
  # Backend API + Static App Service
  - type: web
    name: orca-marine-intelligence
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt && cd ../frontend && npm install --legacy-peer-deps && npm run build"
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 8008
      - key: PYTHON_VERSION
        value: 3.11.0
